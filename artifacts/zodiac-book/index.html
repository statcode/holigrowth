<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- Primary meta -->
    <title>Holistic Growth Life Path — Personalised Astrology & Birth Chart Book</title>
    <meta name="description" content="A full-color hardbound book written entirely from your birth chart. 13 personal chapters across relationships, wealth, health, lucky numbers, and your birthstone — printed in the USA. Preview your opening pages free, then order if you love it." />
    <meta name="theme-color" content="#0e1b2a" />
    <meta name="author" content="Holigrowth" />
    <link rel="canonical" href="https://holigrowth.com/" />

    <!-- Open Graph (Facebook / LinkedIn / iMessage previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Holigrowth" />
    <meta property="og:title" content="Holistic Growth Life Path — Personalised Astrology & Birth Chart Book" />
    <meta property="og:description" content="A full-color hardbound book written entirely from your birth chart. 13 personal chapters across relationships, wealth, health, lucky numbers, and your birthstone. Preview pages free." />
    <meta property="og:url" content="https://holigrowth.com/" />
    <meta property="og:image" content="https://holigrowth.com/images/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Holistic Growth Life Path — a personalised astrology and birth-chart book." />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Holistic Growth Life Path — Personalised Astrology & Birth Chart Book" />
    <meta name="twitter:description" content="A full-color hardbound book written entirely from your birth chart. Preview pages free before ordering." />
    <meta name="twitter:image" content="https://holigrowth.com/images/opengraph.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- JSON-LD structured data: Product + Organization + WebSite. Helps
         Google's rich-results, Bing, and AI assistants (ChatGPT / Perplexity /
         Claude) extract the right facts about the brand and the book even
         when they don't execute JavaScript. Keep these in sync with the
         marketing copy on the homepage. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://holigrowth.com/#organization",
          "name": "Holigrowth",
          "url": "https://holigrowth.com/",
          "logo": "https://holigrowth.com/images/holigrowth-logo.png",
          "description": "Holigrowth crafts personalised astrology and numerology books written from your birth chart — printed in the USA.",
          "sameAs": []
        },
        {
          "@type": "WebSite",
          "@id": "https://holigrowth.com/#website",
          "url": "https://holigrowth.com/",
          "name": "Holigrowth",
          "publisher": { "@id": "https://holigrowth.com/#organization" },
          "inLanguage": "en-US"
        },
        {
          "@type": "Product",
          "@id": "https://holigrowth.com/#book",
          "name": "Holistic Growth Life Path",
          "category": "Book",
          "brand": { "@id": "https://holigrowth.com/#organization" },
          "description": "A full-color hardbound personalised astrology and numerology book written entirely from your birth chart. 13 chapters across relationships, wealth, health, lucky numbers, daily mantras, monthly forecast, and your birthstone talisman.",
          "image": [
            "https://holigrowth.com/images/book-cover-mockup.png",
            "https://holigrowth.com/images/book-cover-mockup2.png"
          ],
          "aggregateRating": {
            "@type": "AggregateRating",
            "ratingValue": "4.9",
            "ratingCount": "127",
            "bestRating": "5"
          },
          "offers": {
            "@type": "Offer",
            "priceCurrency": "USD",
            "price": "99.99",
            "availability": "https://schema.org/InStock",
            "url": "https://holigrowth.com/create",
            "shippingDetails": {
              "@type": "OfferShippingDetails",
              "shippingDestination": {
                "@type": "DefinedRegion",
                "addressCountry": "US"
              },
              "deliveryTime": {
                "@type": "ShippingDeliveryTime",
                "transitTime": {
                  "@type": "QuantitativeValue",
                  "minValue": 14,
                  "maxValue": 21,
                  "unitCode": "DAY"
                }
              }
            }
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
